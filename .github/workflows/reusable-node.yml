name: Reusable Node quality

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "22"
      working-directory:
        required: false
        type: string
        default: "."
      install-command:
        required: false
        type: string
        default: "npm ci"
      lint-command:
        required: false
        type: string
        default: "npm run lint --if-present"
      typecheck-command:
        required: false
        type: string
        default: "npm run typecheck --if-present"
      test-command:
        required: false
        type: string
        default: "npm test --if-present"
      run-build:
        required: false
        type: boolean
        default: true
      build-command:
        required: false
        type: string
        default: "npm run build --if-present"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install dependencies
        run: ${{ inputs.install-command }}
        working-directory: ${{ inputs.working-directory }}
      - name: Lint (when configured)
        run: ${{ inputs.lint-command }}
        working-directory: ${{ inputs.working-directory }}
      - name: Typecheck
        run: ${{ inputs.typecheck-command }}
        working-directory: ${{ inputs.working-directory }}
      - name: Tests (when configured)
        run: ${{ inputs.test-command }}
        working-directory: ${{ inputs.working-directory }}
      - name: Production build
        if: ${{ inputs.run-build }}
        run: ${{ inputs.build-command }}
        working-directory: ${{ inputs.working-directory }}
      - name: Explain skipped build
        if: ${{ !inputs.run-build }}
        run: echo "Build skipped because this package requires external runtime services or content not available in CI."
      - name: Generate dependency audit report (informational)
        if: ${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) != '' }}
        run: npm audit --json > npm-audit.json || true
        working-directory: ${{ inputs.working-directory }}
      - name: Upload dependency audit report
        if: always() && hashFiles(format('{0}/package-lock.json', inputs.working-directory)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report-${{ inputs.working-directory }}
          path: ${{ inputs.working-directory }}/npm-audit.json
          if-no-files-found: warn
          retention-days: 14
