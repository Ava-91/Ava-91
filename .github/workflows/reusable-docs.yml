name: Reusable documentation links

on:
  workflow_call:
    inputs:
      exclude:
        description: Regular expressions for known local or unavailable links
        required: false
        type: string
        default: "--exclude localhost"
      paths:
        required: false
        type: string
        default: "./README.md ./docs/**/*.md"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --accept 200,206,429 ${{ inputs.exclude }} ${{ inputs.paths }}
          fail: true
          failIfEmpty: false
